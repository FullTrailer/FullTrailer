<head>
<meta charset="UTF-8" />

<title>FullTrailer — Panel de taller</title>
<style>
:root{--bg:#0f1419;--panel:#1a222d;--panel2:#232d3b;--border:#2e3a4a;--text:#e8eef5;--muted:#8b9bb0;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--row:#151c25}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1a2430,var(--bg));display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:baseline}
header h1{margin:0;font-size:1.25rem;font-weight:650}.sub{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:.35rem;padding:.75rem 1.5rem 0;border-bottom:1px solid var(--border);background:var(--panel)}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:.55rem 1rem;border-radius:.5rem .5rem 0 0;cursor:pointer;font-size:.92rem;font-weight:600}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.active{color:var(--text);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);margin-bottom:-1px}
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;padding:.85rem 1.5rem;background:var(--panel)}
.toolbar input{flex:1;min-width:200px;max-width:420px;background:var(--row);border:1px solid var(--border);color:var(--text);padding:.55rem .75rem;border-radius:.45rem;font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{background:var(--panel2);border:1px solid var(--border);padding:.25rem .65rem;border-radius:999px;font-size:.8rem;color:var(--muted)}.chip b{color:var(--text)}
main{padding:0 1.5rem 2rem}.panel{display:none}.panel.active{display:block}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:.6rem;background:var(--panel);max-height:calc(100vh - 210px)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:650;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;z-index:1;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}tr:hover td{background:#1c2633}
.acts{max-width:340px;color:var(--muted);font-size:.8rem}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}.badge.warn{background:rgba(245,158,11,.15);color:var(--warn)}
footer{padding:.75rem 1.5rem 1.5rem;color:var(--muted);font-size:.8rem}
</style>
</head>

let currentTab = "ordenes";
let sortKey = null;
let sortDir = 1;
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + currentTab).classList.add("active");
  sortKey = null; document.getElementById("q").value = ""; render();
}));
document.getElementById("q").addEventListener("input", render);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function match(row,q){if(!q)return true;return JSON.stringify(row).toLowerCase().includes(q);}
function sortRows(rows,key){if(!key)return rows;return [...rows].sort((a,b)=>{const va=a[key],vb=b[key];if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;if(typeof va==="number"&&typeof vb==="number")return (va-vb)*sortDir;return String(va).localeCompare(String(vb),"es",{numeric:true})*sortDir;});}
function head(cols,tableId){const thead=document.querySelector("#"+tableId+" thead");thead.innerHTML="<tr>"+cols.map(([k,label])=>`<th data-k="${k}">${label}${sortKey===k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";thead.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();}));}
function renderOrdenes(q){
  const cols=[["folio","Folio"],["status","Estado"],["fecha","Fecha"],["vehiculo","Unidad"],["servicio","Servicio"],["responsable","Responsable"],["est_h","Est. h"],["n_acts","# Act"],["actividades","Actividades"],["gran_total","Gran total"]];
  head(cols,"tbl-ordenes");
  let rows=DATA.ordenes.filter(r=>match(r,q)); rows=sortRows(rows,sortKey||"folio");
  document.querySelector("#tbl-ordenes tbody").innerHTML=rows.map(r=>`<tr>
    <td class="mono"><b>${esc(r.folio)}</b></td>
    <td><span class="badge ${r.status==="Con bitacora"?"ok":"warn"}">${esc(r.status)}</span></td>
    <td>${esc(r.fecha)}</td><td>${esc(r.vehiculo)}</td><td>${esc(r.servicio)}</td><td>${esc(r.responsable)}</td>
    <td class="mono">${r.est_h??""}</td><td class="mono">${r.n_acts??""}</td>
    <td class="acts">${esc(r.actividades)}</td><td class="mono">${r.gran_total??""}</td></tr>`).join("")||`<tr><td colspan="10">Sin resultados</td></tr>`;
  document.getElementById("stats").innerHTML=`<span class="chip">Folios unicos <b>${DATA.orden_meta.folios_unicos}</b></span><span class="chip">Con bitacora <b>${DATA.orden_meta.con_bitacora}</b></span><span class="chip">Solo inicial <b>${DATA.orden_meta.inicial}</b></span><span class="chip">Filas JSON <b>${DATA.orden_meta.registros_json}</b></span><span class="chip">Mostrando <b>${rows.length}</b></span>`;
}
function renderMecanicos(q){
  const cols=[["id","ID"],["nombre","Nombre"],["puesto","Puesto"]]; head(cols,"tbl-mecanicos");
  let rows=DATA.mecanicos.filter(r=>match(r,q)); rows=sortRows(rows,sortKey||"id");
  document.querySelector("#tbl-mecanicos tbody").innerHTML=rows.map(r=>`<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.nombre)}</td><td>${esc(r.puesto)}</td></tr>`).join("")||`<tr><td colspan="3">Sin resultados</td></tr>`;
  document.getElementById("stats").innerHTML=`<span class="chip">${esc(DATA.mec_meta.empresa||"")}</span><span class="chip">Plantilla <b>${DATA.mec_meta.total??DATA.mecanicos.length}</b></span><span class="chip">Mostrando <b>${rows.length}</b></span>`;
}
function renderOperadores(q){
  const cols=[["fecha","Fecha"],["operador","Operador"],["tractor","Tractor"],["remolque","Remolque"],["folio","Folio"],["tracto","Reporte tracto"],["remolque_1","Remolque 1"],["dolly","Dolly"],["remolque_2","Remolque 2"],["observaciones","Obs."]];
  head(cols,"tbl-operadores");
  let rows=DATA.operadores.filter(r=>match(r,q)); rows=sortRows(rows,sortKey||"fecha");
  document.querySelector("#tbl-operadores tbody").innerHTML=rows.map(r=>`<tr>
    <td>${esc(r.fecha)}</td><td>${esc(r.operador)}</td><td class="mono">${esc(r.tractor)}</td><td class="mono">${esc(r.remolque)}</td><td class="mono">${esc(r.folio)}</td>
    <td class="acts">${esc(r.tracto)}</td><td class="acts">${esc(r.remolque_1)}</td><td class="acts">${esc(r.dolly)}</td><td class="acts">${esc(r.remolque_2)}</td><td class="acts">${esc(r.observaciones)}</td></tr>`).join("")||`<tr><td colspan="10">Sin resultados</td></tr>`;
  document.getElementById("stats").innerHTML=`<span class="chip">Reportes <b>${DATA.operadores.length}</b></span><span class="chip">Mostrando <b>${rows.length}</b></span>`;
}
function render(){const q=document.getElementById("q").value.trim().toLowerCase(); if(currentTab==="ordenes")renderOrdenes(q); else if(currentTab==="mecanicos")renderMecanicos(q); else renderOperadores(q);}
